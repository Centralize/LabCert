[package]
name = "labcert"
version = "1.0.0"
edition = "2021"
description = "Local network certificate authority with a desktop UI, HTTP/HTTPS distribution, enrollment API and ACME"

[dependencies]
eframe = "0.37"
egui = "0.37"
rcgen = { version = "=0.13.2", features = ["x509-parser", "pem", "ring"] }
x509-parser = { version = "0.16", features = ["verify"] }
pem = "3"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
ring = "0.17"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
p12 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"

[profile.dev.package."*"]
opt-level = 2
